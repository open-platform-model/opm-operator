version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # "deps" is not a Conventional Commit type, so release-please drops such
      # merge commits from the changelog. Use "build(deps)".
      prefix: "build"
      include: "scope"
    groups:
      # The Kubernetes stack moves in lockstep; bump it as one PR.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
