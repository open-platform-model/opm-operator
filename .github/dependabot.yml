version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      # The Kubernetes stack moves in lockstep; bump it as one PR.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
