name: Deps cascade

# The release cascade receiver (workspace RELEASING.md, "The receiver" and
# "Two-job split"; Phase 3 wiring contract (version 3.1) 5, 5.2). The cascade
# job calls the reusable cascade-receive.yml, which validates the payload, runs
# task -x deps:cascade, plans the push and posts the G2 and G3 statuses; it
# holds no secret. The publish job is this repo's own: it declares
# environment: cascade and passes the App key to the SHA-pinned
# cascade-publish action as an input; it has no checkout or run: of its own,
# and the action checks the repo out but never runs it.
#
# It is a dry run unless the repo variable CASCADE_DRY_RUN is exactly false:
# unset, deleted or any other value pushes nothing (contract 9.1). Every
# .github reference here, in release.yml, cascade-gates.yml, module-deps.yml and
# cascade-task.yml carries one SHA, moved only by a ci(deps) pin PR. A
# gates-only run never starts publish, and cascade-publish refuses one through
# its gates-only input. The wiring check (Lint job) enforces all of this.

on:
  repository_dispatch:
    types: [upstream-released]
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and show the diff in the job summary; push nothing
        type: boolean
        default: false
      gates_only:
        description: Evaluate and post the release-PR gates only (sent by Cascade gates)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.ref != 'refs/heads/main' && format('deps-cascade-{0}', github.ref) || (inputs.gates_only && 'deps-cascade-gates' || 'deps-cascade') }}
  cancel-in-progress: false

jobs:
  cascade:
    name: Deps cascade
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: open-platform-model/.github/.github/workflows/cascade-receive.yml@0f9c6ac2c9b752a79f4874f637ef9955bcf00c13 # .github main
    with:
      dry-run: ${{ inputs.dry_run == true || vars.CASCADE_DRY_RUN != 'false' }}
      gates-only: ${{ inputs.gates_only == true }}
      g2-mode: ${{ vars.CASCADE_G2_MODE || 'warn' }}
      g3-mode: ${{ vars.CASCADE_G3_MODE || 'warn' }}
      setup-go: true

  publish:
    name: Publish
    needs: cascade
    if: >-
      !cancelled()
      && needs.cascade.outputs.compute-ok == 'true'
      && needs.cascade.outputs.dry-run == 'false'
      && inputs.dry_run != true
      && inputs.gates_only != true
      && vars.CASCADE_DRY_RUN == 'false'
      && github.ref == 'refs/heads/main'
      && contains(fromJSON('["push","recreate","close","conflict","too_long"]'), needs.cascade.outputs.action)
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Publish
        uses: open-platform-model/.github/.github/actions/cascade-publish@0f9c6ac2c9b752a79f4874f637ef9955bcf00c13 # .github main
        with:
          dry-run: ${{ inputs.dry_run == true || vars.CASCADE_DRY_RUN != 'false' }}
          gates-only: ${{ inputs.gates_only == true }}
          labels-managed: false
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
