name: Docs

# The opm-operator docs bundle (docs-kit.cue): the authored pages under
# docs/site/ plus the resource reference generated from config/crd/bases and
# config/samples, built, signed and published by docs-kit's reusable
# publish.yml (docs-kit docs/contracts.md C5). opmodel.dev's /docs/ tree pulls
# it from ghcr.io/open-platform-model/docs/opm-operator.
#
#   pull_request       check: build and lint, publish nothing
#   push to main       edge: publish the commit as the edge build
#   workflow_dispatch  release: the recovery when release.yml's publish-docs
#                      job did not run for an operator release, and the
#                      backfill of a release cut before this repository gained
#                      docs-kit.cue: main's config meets the tag's tree. The
#                      floor is v1.0.0-beta.4 (its tree has the four CRDs,
#                      the samples and docs/site/); earlier tags are never
#                      backfilled.
#                      revision: a docs revision of a published release. It
#                      applies fix, a single-parent commit on main that changes
#                      only Markdown or only comments, to the release tree and
#                      publishes <version>.<next> (docs-kit README, "Fixing a
#                      release's docs"; docs/contracts.md, "Docs revisions").
#                      Dispatch either on main; publish.yml refuses any other ref:
#                      gh workflow run docs.yml --ref main -f mode=release -f tag=vX.Y.Z
#                      gh workflow run docs.yml --ref main -f mode=revision -f tag=vX.Y.Z -f fix=<40-hex sha>
#
# publish.yml is pinned by docs-kit release tag, never a SHA: the signing
# certificate names it at that ref, and the site trusts only docs-kit's v*
# tags (C5, C9). It runs the opm-docs release named in .opm-docs-version; the
# two pins move together in one PR (task docs:pins:check, run by the Lint
# workflow, refuses a mismatch). publish.yml declares no permissions, so each
# job grants exactly what its mode needs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: release (recover or backfill a release with no bundle) or revision (fix a published release's docs)
        type: choice
        options: [release, revision]
        default: release
        required: true
      tag:
        description: The operator release tag (vX.Y.Z)
        type: string
        required: true
      # Required by publish.yml in revision mode, which refuses anything but
      # a full 40-hex hash; release mode ignores it, so it cannot be a
      # required input of the dispatch.
      fix:
        description: "revision only: the full 40-hex commit on main to apply"
        type: string
        default: ""

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.4.0
    with:
      project: opm-operator
      mode: check

  edge:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.4.0
    with:
      project: opm-operator
      mode: edge

  dispatch:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.4.0
    with:
      project: opm-operator
      mode: ${{ inputs.mode }}
      tag: ${{ inputs.tag }}
      fix: ${{ inputs.fix }}
