name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Must stay unique across this repo's jobs: the main ruleset is to require
    # the check "Lint" (workspace RELEASING.md, "Owner settings") because it
    # carries the release-pin gate (G1).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Release-pin gate (G1, release PRs only)
        if: startsWith(github.head_ref || github.ref_name, 'release-please--')
        run: task deps:release-check

      # .opm-docs-version and every docs-kit publish.yml ref under
      # .github/workflows/ name one docs-kit release (docs-kit C5, C12).
      # Offline: no opm-docs install.
      - name: docs-kit pins agree
        run: task docs:pins:check

      - name: Check linter configuration
        run: task dev:lint:config
      - name: Run linter
        run: task dev:lint

      # docs/site/reference/operator-resources.md is generated from the
      # committed CRDs, config/samples and internal/controller (hack/crdref).
      - name: Generated resource reference is current
        run: task dev:docs:reference:check

      # Until crdref is retired, the bundle's generated resource page must
      # equal crdref's block, so a renamed controller fails here before a
      # wrong "Served by" reaches a release bundle (reconciledBy in
      # docs-kit.cue). Installs the pinned opm-docs release.
      - name: Docs bundle matches crdref
        run: task docs:bundle:parity
