name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The operator module's release check runs cue; kept equal to test.yml's.
  CUE_VERSION: 'v0.17.1'

jobs:
  lint:
    # Must stay unique across this repo's jobs: the main ruleset is to require
    # the check "Lint" (workspace RELEASING.md, "Owner settings") because it
    # carries the release-pin gate (G1).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The operator module's release check reads the operator tags
          # (minimum operator version, config/ at the deployed tag).
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0 # exact, never a floating 3.x

      - name: Setup CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: ${{ env.CUE_VERSION }}

      # The key-holding cascade jobs keep their contract shape, and every
      # .github reference carries one pinned SHA (Phase 3 wiring contract
      # (version 3.1) 10.1). Uses the runner's mikefarah yq.
      - name: Verify the cascade wiring
        run: task cascade:wiring:check

      # The operator's release PRs only: the operator module's release PR
      # ships none of go.mod or the fixtures, and its own pins are checked by
      # the module release gate below.
      - name: Release-pin gate (G1, release PRs only)
        if: >-
          startsWith(github.head_ref || github.ref_name, 'release-please--')
          && (github.head_ref || github.ref_name) != 'release-please--branches--main--components--opm_operator'
        run: task deps:release-check

      # The operator module's release gate (operator-module-release, "Module
      # release gate"), on its own release PR only. A step, not a job: a
      # skipped job reports as passing, a failing step fails Lint.
      - name: Operator module release gate (module release PR only)
        if: (github.head_ref || github.ref_name) == 'release-please--branches--main--components--opm_operator'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=$(jq -r '.["modules/opm_operator"] // empty' .release-please-manifest.json)
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error file=.release-please-manifest.json::no proposed operator module version: '$v'"; exit 1; }
          task operator-module:release-check VERSION="$v"

      # The release gate's checks that need no network, over fixture trees.
      - name: Operator module release gate (offline test)
        run: task operator-module:release-check:test

      # The image PR's title, breaking and refusal rules, and the bot branch's
      # create, rebuild and extend rules (offline).
      - name: Operator module image PR scripts (offline tests)
        run: |
          task operator-module:image:test
          task operator-module:bot-pr:test

      # task deps:cascade against the stub resolver, offline scenarios only
      # (.tasks/cascade/test.sh). The network scenarios run in cascade-task.yml.
      - name: Cascade task (offline)
        env:
          CASCADE_TEST_SET: offline
        run: task -x deps:cascade:test

      # .opm-docs-version and every docs-kit publish.yml ref under
      # .github/workflows/ name one docs-kit release (docs-kit C5, C12).
      # Offline: no opm-docs install.
      - name: docs-kit pins agree
        run: task docs:pins:check

      - name: Check linter configuration
        run: task dev:lint:config
      - name: Run linter
        run: task dev:lint
