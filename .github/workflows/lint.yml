name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Must stay unique across this repo's jobs: the ruleset on main requires
    # the check "Lint" because it carries the release-pin gate (G1).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Release-pin gate (G1, release PRs only)
        if: startsWith(github.head_ref || github.ref_name, 'release-please--')
        run: task deps:release-check

      - name: Check linter configuration
        run: task dev:lint:config
      - name: Run linter
        run: task dev:lint
