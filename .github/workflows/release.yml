name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# One release run at a time. Draft releases defeat release-please's duplicate
# guard (GitHub accepts several drafts for one tag), and two image jobs could
# both find the version tag absent. A queued run is never cancelled mid-flight;
# GitHub replaces an older pending run, which is safe because release-please
# derives its state from the branch head and the release PR labels.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: open-platform-model/opm-operator
  # CUE CLI used to publish the example modules. Must be >= the language version
  # the modules + catalog declare (v0.17.0), since an older CLI refuses to read
  # them; kept in step with catalog_opm CI.
  CUE_VERSION: 'v0.17.1'

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Two release-please packages: the operator "." (tags vX.Y.Z) and the
    # operator module "modules/opm_operator" (tags opm_operator-vX.Y.Z). The
    # action's root outputs are the operator's; its any-package output would also be
    # true for a module-only release, so no job reads it. The module's outputs
    # are prefixed with its path and re-exported here under plain names.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      module_release_created: ${{ steps.release.outputs['modules/opm_operator--release_created'] }}
      module_tag_name: ${{ steps.release.outputs['modules/opm_operator--tag_name'] }}
      module_version: ${{ steps.release.outputs['modules/opm_operator--version'] }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The identity advance below pushes to the module's release branch;
      # pushed with GITHUB_TOKEN, that commit's CI would wait for approval.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The operator module's identity.Version has one writer: this step, on the
      # module's open release PR (operator-module-release, "The module's
      # identity version has one writer"). release-please writes the proposed
      # version into the branch's manifest; opm writes it into identity.cue, so
      # the tagged tree is exactly what module-publish pushes. Idempotent: a
      # branch that already declares the version gets no commit.
      - name: Find the operator module's release PR branch
        id: module-branch
        env:
          BRANCH: release-please--branches--main--components--opm_operator
        run: |
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "no open operator module release branch; nothing to advance"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Go
        if: steps.module-branch.outputs.exists == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install opm
        if: steps.module-branch.outputs.exists == 'true'
        run: |
          v=$(tr -d '[:space:]' < .opm-cli-version)
          [[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error file=.opm-cli-version::not a cli tag: '$v'"; exit 1; }
          go install "github.com/open-platform-model/cli/cmd/opm@${v}"

      - name: Advance the operator module's identity.Version on its release PR
        if: steps.module-branch.outputs.exists == 'true'
        env:
          BRANCH: release-please--branches--main--components--opm_operator
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          VERSION=$(jq -r '.["modules/opm_operator"] // empty' .release-please-manifest.json)
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::${BRANCH} proposes no operator module version: '${VERSION}'"; exit 1; }
          opm module version set "${VERSION}" ./modules/opm_operator
          if git diff --quiet; then
            echo "identity.Version already declares ${VERSION}"
            exit 0
          fi
          git add modules/opm_operator/identity/identity.cue
          git commit -m "chore: advance opm_operator identity.Version to ${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"

  image-release:
    name: Build and publish release image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag always names the image first pushed under it
      # (0021:D10:R3). absent: build and push. reuse: a previous attempt of
      # this release already pushed it from the release commit, so push
      # nothing under it and reuse its digest. Anything else fails here.
      - name: Probe the release version tag
        id: probe
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
        run: |
          if ! out=$(.github/scripts/image-tag-guard.sh probe "${REF}" "$(git rev-parse HEAD)"); then
            echo "${out}"
            exit 1
          fi
          echo "${out}"
          echo "${out}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: steps.probe.outputs.state == 'absent'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Read the SHA from the checked-out tag, not the pushed commit, so the
          # revision label and sha-<short> name the release commit.
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Build and push image
        id: build
        if: steps.probe.outputs.state == 'absent'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve the release image digest
        id: digest
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          REUSED: ${{ steps.probe.outputs.digest }}
        run: |
          digest="${BUILT:-${REUSED}}"
          case "${digest}" in
          sha256:*) echo "digest=${digest}" >> "${GITHUB_OUTPUT}" ;;
          *) echo "::error::no release image digest (built '${BUILT}', reused '${REUSED}')"; exit 1 ;;
          esac

      - name: Verify the version tag names the pushed image
        if: steps.probe.outputs.state == 'absent'
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          .github/scripts/image-tag-guard.sh verify "${REF}" "${DIGEST}"

      # A cancelled first attempt may have pushed the version tag without the
      # mutable ones; point sha-<short> and latest at the reused digest.
      - name: Re-point the mutable tags to the reused image
        if: steps.probe.outputs.state == 'reuse'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
          DIGEST: ${{ steps.probe.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && [ "$tag" != "${VERSION_REF}" ] && args+=(-t "$tag")
          done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.digest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && images+=("${tag}@${DIGEST}")
          done <<< "${TAGS}"
          cosign sign --yes "${images[@]}"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: ${{ github.workspace }}/sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Attest SBOM as cosign attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          SBOM_FILE: ${{ github.workspace }}/sbom.spdx.json
        run: |
          if [ ! -s "${SBOM_FILE}" ]; then
            echo "SBOM file ${SBOM_FILE} missing or empty" >&2
            exit 1
          fi
          cosign attest --yes \
            --predicate "${SBOM_FILE}" \
            --type spdxjson \
            "${IMAGE_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Render digest-pinned install manifest
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}@${{ steps.digest.outputs.digest }}
        run: |
          task operator:installer IMG="${IMG}"

      # Assets go to the draft only; --clobber keeps "Re-run failed jobs"
      # idempotent and never touches a published release.
      - name: Upload install.yaml to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          .github/scripts/release-guard.sh assert-draft "${TAG}"
          gh release upload "${TAG}" dist/install.yaml --repo "${GH_REPO}" --clobber

  publish-examples:
    name: Publish example modules and manifests
    # Runs after the image is built, so a failed image release blocks module
    # publication (design D4). Gated on an actual release cut.
    needs: [release-please, image-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      packages: write # cue mod publish to GHCR
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # Full history + tags so changed-module detection can diff the example
          # dirs against the previous release tag.
          fetch-depth: 0

      - name: Setup CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: ${{ env.CUE_VERSION }}

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Log in to GHCR
        # cue mod publish authenticates to ghcr via the docker config credentials.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install opm
        # Fixtures publish through the cli's gated pipeline, so a fixture that
        # violates a publish gate fails the release instead of shipping.
        run: |
          v=$(tr -d '[:space:]' < .opm-cli-version)
          [[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error file=.opm-cli-version::not a cli tag: '$v'"; exit 1; }
          go install "github.com/open-platform-model/cli/cmd/opm@${v}"

      - name: Publish example modules to GHCR (idempotent)
        env:
          # Both domains resolve to ghcr.io/open-platform-model: the fixtures live
          # on testing.opmodel.dev, their deps (core, catalogs) on opmodel.dev.
          # Each module is published at its OWN declared version (read from its
          # identity package); versions already present are treated as success.
          CUE_REGISTRY: 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
          OPM_REGISTRY: 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # --match: the previous operator release, never an operator module tag.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          echo "Publishing example modules changed since: ${PREV_TAG:-<none>}"
          task examples:publish SINCE="${PREV_TAG}"

      - name: Bundle example manifests
        run: task examples:bundle

      - name: Upload example manifests to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          .github/scripts/release-guard.sh assert-draft "${TAG}"
          gh release upload "${TAG}" dist/opm-examples.tar.gz --repo "${GH_REPO}" --clobber
          .github/scripts/release-guard.sh assert-draft "${TAG}"
          gh release upload "${TAG}" dist/examples/*.yaml --repo "${GH_REPO}" --clobber

  # The operator docs bundle of the release (docs-kit.cue, opm-operator), built
  # from the released tag and published as <version>.0 by docs-kit's
  # publish.yml (docs-kit docs/contracts.md C5). It runs here, in the run the
  # release-PR merge starts, because publish.yml publishes only from
  # refs/heads/main: a `release: published` trigger would run on the tag ref
  # and be refused. It waits for image-release, so the reference never
  # describes a release whose image failed; publish-release does not wait for
  # it, so a docs failure never holds the release a draft; it can therefore
  # promote the bundle while the GitHub release is still a draft (accepted in
  # publish-crd-bundle's design). When this job does not run or fails,
  # docs.yml's dispatch publishes the release instead. No
  # version is passed: opm-docs reads it from the tag.
  # publish.yml is pinned by docs-kit release tag, not a SHA: the signing
  # certificate names it at this ref, and the site trusts only docs-kit's v*
  # tags (C5, C9). It moves with .opm-docs-version in one PR.
  publish-docs:
    name: Publish the operator docs bundle
    needs: [release-please, image-release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.7.0
    with:
      project: opm-operator
      mode: release
      tag: ${{ needs.release-please.outputs.tag_name }}

  publish-release:
    name: Publish the draft release
    # The single publish point: the release becomes public only after every
    # job that attaches an asset has succeeded. A failed run leaves a draft;
    # recover with "Re-run failed jobs", never "Re-run all jobs".
    needs: [release-please, image-release, publish-examples]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Checkout the release guard at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          sparse-checkout: .github/scripts

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          .github/scripts/release-guard.sh publish "${TAG}"

  # Caller-owned: this job declares environment: cascade and passes the App key
  # to the SHA-pinned cascade-notify action as an input.
  notify-downstream:
    name: Notify downstream
    needs: [release-please, publish-release]
    if: needs.release-please.outputs.release_created == 'true' && vars.CASCADE_NOTIFY != 'off'
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Notify downstream
        uses: open-platform-model/.github/.github/actions/cascade-notify@2376ffae4bfc665f327d51581350dea694c01504 # .github main
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}

  # The operator module's release (operator-module-release): its tagged tree is
  # published once, at the version its identity package declares, and the
  # install manifest rendered from the published module is attached to its
  # draft. The module's release gate runs again first, so a release PR merged
  # past a red check publishes nothing. It never runs for an operator release.
  module-publish:
    name: Publish the operator module
    needs: release-please
    if: needs.release-please.outputs.module_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload
      packages: write # opm module publish to GHCR
    services:
      # Job-local registry: a re-run compares GHCR's held version with this
      # tag's tree published here (hack/operator-module/publish.sh).
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      MODULE_TAG: ${{ needs.release-please.outputs.module_tag_name }}
      MODULE_VERSION: ${{ needs.release-please.outputs.module_version }}
      # opmodel.dev (the module, core and the catalogs) resolves to GHCR; opm
      # reads OPM_REGISTRY, cue reads CUE_REGISTRY.
      OPM_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
      CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
    steps:
      - name: Refuse anything but this repository's module release tag
        env:
          REPO: ${{ github.repository }}
        run: |
          [ "${REPO}" = open-platform-model/opm-operator ] \
            || { echo "::error::the operator module publishes only from open-platform-model/opm-operator, not ${REPO}"; exit 1; }
          [[ ${MODULE_TAG} =~ ^opm_operator-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'${MODULE_TAG}' is not an operator module release tag"; exit 1; }
          [ "${MODULE_TAG}" = "opm_operator-v${MODULE_VERSION}" ] \
            || { echo "::error::tag ${MODULE_TAG} and version ${MODULE_VERSION} disagree"; exit 1; }

      - name: Checkout the module release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MODULE_TAG }}
          # The release check needs the operator tags (minimum version, drift
          # against the deployed tag's config/).
          fetch-depth: 0

      - name: Setup CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: ${{ env.CUE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Install opm and crane
        run: |
          v=$(tr -d '[:space:]' < .opm-cli-version)
          [[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error file=.opm-cli-version::not a cli tag: '$v'"; exit 1; }
          go install "github.com/open-platform-model/cli/cmd/opm@${v}"
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Operator module release check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: task operator-module:release-check VERSION="${MODULE_VERSION}"

      - name: Publish the operator module (once)
        id: publish
        run: hack/operator-module/publish.sh "${MODULE_VERSION}" >> "${GITHUB_OUTPUT}"

      # The published version, rendered from the registry at its #config
      # defaults (never debugValues) with no cluster: the kubectl manifest.
      - name: Render the install manifest from the published module
        env:
          KUBECONFIG: /nonexistent
        run: |
          mkdir -p "${RUNNER_TEMP}/module"
          opm module build opmodel.dev/modules/opm_operator --version "${MODULE_VERSION}" \
            --name opm-operator -n opm-operator-system \
            -f hack/operator-module/defaults.cue > "${RUNNER_TEMP}/module/install.yaml"
          hack/operator-module/manifest-order.sh "${RUNNER_TEMP}/module/install.yaml"

      # Assets go to the draft only; --clobber keeps "Re-run failed jobs"
      # idempotent and never touches a published release.
      - name: Upload install.yaml to the module's draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          .github/scripts/release-guard.sh assert-draft "${MODULE_TAG}"
          gh release upload "${MODULE_TAG}" "${RUNNER_TEMP}/module/install.yaml" --repo "${GH_REPO}" --clobber

  module-publish-release:
    name: Publish the operator module's draft release
    # The module's single publish point: public only once install.yaml is
    # attached. Recover a failed run with "Re-run failed jobs".
    needs: [release-please, module-publish]
    if: needs.release-please.outputs.module_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Checkout the release guard at the module release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.module_tag_name }}
          sparse-checkout: .github/scripts

      - name: Publish the module's draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MODULE_TAG: ${{ needs.release-please.outputs.module_tag_name }}
        run: |
          .github/scripts/release-guard.sh publish "${MODULE_TAG}"

  # After every published operator release, the PR that moves the operator
  # module to it (module-image.yml; operator-module-release, "An operator
  # release opens the PR that moves the module's image"). It produces no
  # release artifact. Recover a failed run with module-image.yml's dispatch.
  module-image-pr:
    name: Open the operator module image PR
    needs: [release-please, publish-release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/module-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
