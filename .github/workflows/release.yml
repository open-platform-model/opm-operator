name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: open-platform-model/opm-operator
  # CUE CLI used to publish the example modules. Must be >= the language version
  # the modules + catalog declare (v0.17.0), since an older CLI refuses to read
  # them; kept in step with catalog_opm CI.
  CUE_VERSION: 'v0.17.1'

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image-release:
    name: Build and publish release image
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && images+=("${tag}@${DIGEST}")
          done <<< "${TAGS}"
          cosign sign --yes "${images[@]}"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ github.workspace }}/sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Attest SBOM as cosign attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SBOM_FILE: ${{ github.workspace }}/sbom.spdx.json
        run: |
          if [ ! -s "${SBOM_FILE}" ]; then
            echo "SBOM file ${SBOM_FILE} missing or empty" >&2
            exit 1
          fi
          cosign attest --yes \
            --predicate "${SBOM_FILE}" \
            --type spdxjson \
            "${IMAGE_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Render digest-pinned install manifest
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}@${{ steps.build.outputs.digest }}
        run: |
          task operator:installer IMG="${IMG}"

      - name: Upload install.yaml to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG}" dist/install.yaml --clobber

  publish-examples:
    name: Publish example modules and manifests
    # Runs after the image is built, so a failed image release blocks module
    # publication (design D4). Gated on an actual release cut.
    needs: [release-please, image-release]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      packages: write # cue mod publish to GHCR
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # Full history + tags so changed-module detection can diff the example
          # dirs against the previous release tag.
          fetch-depth: 0

      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: ${{ env.CUE_VERSION }}

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Log in to GHCR
        # cue mod publish authenticates to ghcr via the docker config credentials.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install opm
        # Fixtures publish through the cli's gated pipeline, so a fixture that
        # violates a publish gate fails the release instead of shipping.
        run: go install github.com/open-platform-model/cli/cmd/opm@v1.0.0-alpha.14

      - name: Publish example modules to GHCR (idempotent)
        env:
          # Both domains resolve to ghcr.io/open-platform-model: the fixtures live
          # on testing.opmodel.dev, their deps (core, catalogs) on opmodel.dev.
          # Each module is published at its OWN declared version (read from its
          # identity package); versions already present are treated as success.
          CUE_REGISTRY: 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
          OPM_REGISTRY: 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          echo "Publishing example modules changed since: ${PREV_TAG:-<none>}"
          task examples:publish SINCE="${PREV_TAG}"

      - name: Bundle example manifests
        run: task examples:bundle

      - name: Upload example manifests to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG}" dist/opm-examples.tar.gz --clobber
          gh release upload "${TAG}" dist/examples/*.yaml --clobber
