version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    depguard:
      rules:
        # The library's Kubernetes tier owns the object and label decisions;
        # the operator keeps no copy of them (0012:D3:R6). This refuses the
        # path the operator's own copy lived under.
        no-local-kubernetes-tier-copy:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/open-platform-model/opm-operator/pkg/core
              desc: the operator keeps no copy of the library's Kubernetes tier; import github.com/open-platform-model/library/opm/k8s/object or github.com/open-platform-model/library/opm/k8s/labels
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
