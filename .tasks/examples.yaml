version: '3'

# Example test module publishing + manifest bundling.
#
# Modules under test/fixtures/modules/<m>/ are published as CUE modules to
# testing.opmodel.dev/modules/operator/<m> at each module's OWN declared version,
# independent of the operator's release version. Publishing is idempotent: a
# version already present in the registry is treated as success (CUE module
# versions are immutable). On release, CI runs `examples:publish` against GHCR,
# then `examples:bundle` and uploads the manifests to the GitHub Release.
#
# THE VERSION LIVES IN identity/identity.cue, NOT module.cue. Each fixture is a
# publishable artifact whose identity subpackage is the single source of its path
# and version (core #IdentityPackage; enhancements 0010 D38 / 0011 D12), and whose
# metadata derives from it. The former contract here — "the FIRST `version:`
# string literal in module.cue" read with grep — is RETIRED: under a derived
# metadata block there is no version literal in module.cue at all, and the grep
# would silently report nothing and publish nothing. Read it with
# `cue eval ./identity --out text -e Version` instead; that needs no registry
# access, matching what the grep was chosen for.
#
# Publishing goes through `opm module publish`, not `cue mod publish`, so every
# publish gate runs over the fixtures — the same pipeline the cli's own fixtures
# and the official templates use. A fixture that violates a gate fails CI instead
# of shipping. The fixtures live on the testing domain because `gateNamespace`
# refuses a nested path under opmodel.dev outright.

vars:
  MODULES_DIR: '{{.MODULES_DIR | default "test/fixtures/modules"}}'
  RELEASES_DIR: '{{.RELEASES_DIR | default "test/fixtures/modulepackages"}}'
  DIST_DIR: '{{.DIST_DIR | default "dist/examples"}}'
  # GHCR mapping. Both domains must map: the fixtures are on testing.opmodel.dev,
  # their deps (core, catalogs) on opmodel.dev. CI sets CUE_REGISTRY in the
  # environment; for local publishing pass
  # CUE_REGISTRY=testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,...
  GHCR_CUE_REGISTRY: '{{.GHCR_CUE_REGISTRY | default "testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works"}}'
  # `opm` resolves --registry > OPM_REGISTRY > ~/.opm/config.cue and never reads
  # CUE_REGISTRY, so both are exported wherever it runs.
  OPM: '{{.OPM | default "opm"}}'

tasks:
  list:
    desc: List example module directories
    cmds:
      - find {{.MODULES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort

  version:
    desc: 'Print a module''s declared semver (MODULE_DIR=test/fixtures/modules/<m>)'
    requires:
      vars: [MODULE_DIR]
    cmds:
      - cue eval {{.MODULE_DIR}}/identity --out text -e Version

  publish:
    desc: 'Publish each example module at its declared version if absent (idempotent). SINCE=<git-ref> limits to modules changed since that ref. PRERELEASE=<id> appends a SemVer pre-release segment (e.g. e2e.gabc1234) so the tag never claims the real release version.'
    vars:
      PUBLISH_REGISTRY: '{{.CUE_REGISTRY | default .GHCR_CUE_REGISTRY}}'
      PRERELEASE: '{{.PRERELEASE | default ""}}'
    cmds:
      - |
        set -euo pipefail
        # Both are needed and they are read by different things: `cue eval` reads
        # CUE_REGISTRY, `opm` reads OPM_REGISTRY (--registry > OPM_REGISTRY >
        # ~/.opm/config.cue — never CUE_REGISTRY). Exporting only the former would
        # silently leave opm on the caller's personal config.
        export CUE_REGISTRY='{{.PUBLISH_REGISTRY}}'
        export OPM_REGISTRY='{{.PUBLISH_REGISTRY}}'
        opm='{{.OPM}}'
        command -v "$opm" >/dev/null || { echo "opm not on PATH — install the pinned cli release" >&2; exit 1; }
        since='{{.SINCE}}'
        prerelease='{{.PRERELEASE}}'
        rc=0
        for dir in $(find {{.MODULES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort); do
          name=$(basename "$dir")
          # Changed-module detection (D3): when SINCE is a valid ref, skip
          # modules whose dir is unchanged since it. The absent-check below is
          # the authority that keeps the step idempotent even if SINCE is empty.
          if [ -n "$since" ] && git rev-parse -q --verify "$since" >/dev/null 2>&1; then
            if git diff --quiet "$since" -- "$dir"; then
              echo "skip ${name}: unchanged since ${since}"
              continue
            fi
          fi
          # The declared version comes from the identity package, the module's
          # single source of path and version. A tree without one is not
          # publishable and is a hard error, never a silent skip — the old
          # grep contract's `continue` made a broken fixture look like success.
          if [ ! -d "$dir/identity" ]; then
            echo "${name}: no identity/ package — not a publishable fixture" >&2
            rc=1
            continue
          fi
          ver=$(cd "$dir" && cue eval ./identity --out text -e Version)
          if [ -z "$ver" ]; then
            echo "${name}: identity package declares no concrete Version" >&2
            rc=1
            continue
          fi
          tag="v${ver}"
          srcdir="$dir"
          # Pre-release publishes (PR e2e) tag as v<ver>-<prerelease> so they
          # are valid SemVer that sorts BELOW the eventual release version and
          # never collides with the immutable v<ver> cut on release.
          #
          # The DECLARED version has to move with the tag: the library's
          # acquire-time identity check (enhancement 0010 D11) requires
          # metadata.version to equal the fetched tag exactly. Stage a copy and
          # let `opm module version set` do the write — it is offline, surgical,
          # and preserves the defaulted-disjunction assertion byte-for-byte.
          # (`opm module publish --version` cannot serve here: it ASSERTS a
          # declared version rather than filling one, and ours carries a default.)
          if [ -n "$prerelease" ]; then
            tag="${tag}-${prerelease}"
            srcdir=$(mktemp -d)
            cp -R "$dir/." "$srcdir/"
            if ! "$opm" module version set "${ver}-${prerelease}" "$srcdir" >/dev/null; then
              echo "prerelease version set failed for ${name}" >&2
              rm -rf "$srcdir"
              rc=1
              continue
            fi
          fi
          echo "==> publishing ${name} @ ${tag}"
          if out=$("$opm" module publish "$srcdir" 2>&1); then
            echo "$out"
          # An already-published tag is always a refusal (enhancement 0011 D15);
          # publish never skips, so idempotency across releases is decided here.
          # Auth/network failures (exit 3) do NOT match and surface.
          elif printf '%s' "$out" | grep -qiE 'already holds|already exists|already present|409|conflict|immutable'; then
            echo "skip ${name} @ ${tag}: already present (idempotent)"
          else
            echo "$out" >&2
            rc=1
          fi
          if [ "$srcdir" != "$dir" ]; then
            rm -rf "$srcdir"
          fi
        done
        exit $rc

  pin:
    desc: 'Rewrite each example moduleinstance.yaml spec.module.version to the module''s declared version, optionally with a PRERELEASE segment (matches examples:publish PRERELEASE=<id>). Used by PR e2e to point fixtures at the just-published pre-release tag.'
    vars:
      PRERELEASE: '{{.PRERELEASE | default ""}}'
    cmds:
      - |
        set -euo pipefail
        prerelease='{{.PRERELEASE}}'
        for dir in $(find {{.MODULES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort); do
          name=$(basename "$dir")
          mr="$dir/moduleinstance.yaml"
          [ -f "$mr" ] || continue
          [ -d "$dir/identity" ] || continue
          ver=$(cd "$dir" && cue eval ./identity --out text -e Version)
          if [ -z "$ver" ]; then
            echo "${name}: identity package declares no concrete Version" >&2
            exit 1
          fi
          tag="v${ver}"
          if [ -n "$prerelease" ]; then
            tag="${tag}-${prerelease}"
          fi
          # Replace only the indented `version:` line (the module pin); the
          # apiVersion lines above are untouched (they have no leading space
          # before `version`). The pin always resets to v<ver>[-<prerelease>],
          # so re-running with a different PRERELEASE is idempotent.
          sed -i -E "s|^([[:space:]]+version:[[:space:]]+).*$|\1${tag}|" "$mr"
          echo "pinned ${name} moduleinstance -> ${tag}"
        done

  bundle:
    desc: Bundle example ModuleInstance manifests into release assets under dist/
    cmds:
      - |
        set -euo pipefail
        rm -rf {{.DIST_DIR}}
        mkdir -p {{.DIST_DIR}}
        # Per-module ModuleInstance manifests.
        for dir in $(find {{.MODULES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort); do
          name=$(basename "$dir")
          if [ -f "$dir/moduleinstance.yaml" ]; then
            cp "$dir/moduleinstance.yaml" "{{.DIST_DIR}}/${name}-moduleinstance.yaml"
          fi
        done
        # ModulePackage/OCIRepository fixtures, where present.
        if [ -d "{{.RELEASES_DIR}}" ]; then
          for dir in $(find {{.RELEASES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort); do
            name=$(basename "$dir")
            for f in "$dir"/modulepackage.yaml "$dir"/ocirepository.yaml; do
              [ -f "$f" ] && cp "$f" "{{.DIST_DIR}}/modulepackage-${name}-$(basename "$f")"
            done
          done
        fi
        tar -czf dist/opm-examples.tar.gz -C {{.DIST_DIR}} .
        echo "bundled manifests:"; ls -1 {{.DIST_DIR}}; echo "tarball: dist/opm-examples.tar.gz"
