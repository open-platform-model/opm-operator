version: '3'

# Example test module publishing + manifest bundling.
#
# Modules under test/fixtures/modules/<m>/ are published as CUE modules to
# testing.opmodel.dev/modules/operator/<m> at each module's OWN declared version,
# independent of the operator's release version. The version lives in
# identity/identity.cue (core #IdentityPackage; enhancements 0010 D38 / 0011 D12),
# never in module.cue.
#
# Publishing, seeding and the publish gates live in hack/fixtures.sh (one script,
# identical in cli and opm-operator); these tasks are thin wrappers plus the
# operator-only pieces: pinning moduleinstance.yaml / modulepackage / sample
# manifests and bundling release assets. Publishing is idempotent: a version
# already present in the registry is treated as success (CUE module versions are
# immutable). On release, CI runs `examples:publish` against GHCR, then
# `examples:bundle` and uploads the manifests to the GitHub Release. PR CI seeds a
# job-local registry from the tree instead (`hack/fixtures.sh seed`).

vars:
  MODULES_DIR: '{{.MODULES_DIR | default "test/fixtures/modules"}}'
  RELEASES_DIR: '{{.RELEASES_DIR | default "test/fixtures/modulepackages"}}'
  DIST_DIR: '{{.DIST_DIR | default "dist/examples"}}'
  # GHCR mapping. Both domains must map: the fixtures are on testing.opmodel.dev,
  # their deps (core, catalogs) on opmodel.dev. For a local publish pass the
  # MIXED_CUE_REGISTRY mapping (root Taskfile.yml) as CUE_REGISTRY.
  GHCR_CUE_REGISTRY: '{{.GHCR_CUE_REGISTRY | default "testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works"}}'
  # `opm` resolves --registry > OPM_REGISTRY > ~/.opm/config.cue and never reads
  # CUE_REGISTRY, so both are exported wherever it runs.
  OPM: '{{.OPM | default "opm"}}'

tasks:
  list:
    desc: List example module directories
    cmds:
      - find {{.MODULES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort

  pins:
    desc: 'Print each example module''s declared coordinate (<path>=<version>) from its identity package'
    cmds:
      - FIXTURES_DIR={{.MODULES_DIR}} hack/fixtures.sh pins

  version:
    desc: 'Print a module''s declared semver (MODULE_DIR=test/fixtures/modules/<m>)'
    requires:
      vars: [MODULE_DIR]
    cmds:
      - cue eval {{.MODULE_DIR}}/identity --out text -e Version

  check:
    desc: 'Run every publish gate over the example modules (dry run against GHCR) and enforce changed-implies-bumped against BASE_REF (default origin/main)'
    cmds:
      - FIXTURES_DIR={{.MODULES_DIR}} OPM_BIN={{.OPM}} hack/fixtures.sh check

  seed:
    desc: 'Publish the tree''s example modules into the LOCAL registry CUE_REGISTRY maps testing.opmodel.dev to (PR CI and local iteration; refuses a ghcr.io mapping)'
    cmds:
      - FIXTURES_DIR={{.MODULES_DIR}} OPM_BIN={{.OPM}} CUE_REGISTRY='{{.CUE_REGISTRY}}' hack/fixtures.sh seed

  publish:
    desc: 'Publish each example module at its declared version if absent (idempotent). SINCE=<git-ref> limits to modules changed since that ref. PRERELEASE=<id> appends a SemVer pre-release segment (e.g. e2e.gabc1234) so the tag never claims the real release version.'
    vars:
      PUBLISH_REGISTRY: '{{.CUE_REGISTRY | default .GHCR_CUE_REGISTRY}}'
    cmds:
      - FIXTURES_DIR={{.MODULES_DIR}} OPM_BIN={{.OPM}} CUE_REGISTRY='{{.PUBLISH_REGISTRY}}' SINCE='{{.SINCE}}' PRERELEASE='{{.PRERELEASE}}' hack/fixtures.sh publish

  pin:
    desc: 'Re-pin every consumer of an example module''s version to its declared version, optionally with a PRERELEASE segment (matches examples:publish PRERELEASE=<id>): the module''s moduleinstance.yaml, its modulepackage fixture''s cue.mod dep, and config/samples. Used by PR e2e to point the fleet at the just-published pre-release tags.'
    vars:
      PRERELEASE: '{{.PRERELEASE | default ""}}'
      SAMPLE_MI: '{{.SAMPLE_MI | default "config/samples/opmodel.dev_v1alpha1_moduleinstance.yaml"}}'
    cmds:
      - |
        set -euo pipefail
        prerelease='{{.PRERELEASE}}'
        for dir in $(find {{.MODULES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort); do
          name=$(basename "$dir")
          [ -d "$dir/identity" ] || continue
          ver=$(cd "$dir" && cue eval ./identity --out text -e Version)
          path=$(cd "$dir" && cue eval ./identity --out text -e ModulePath)
          if [ -z "$ver" ] || [ -z "$path" ]; then
            echo "${name}: identity package declares no concrete Version/ModulePath" >&2
            exit 1
          fi
          tag="v${ver}"
          if [ -n "$prerelease" ]; then
            tag="${tag}-${prerelease}"
          fi
          # moduleinstance.yaml: replace only the indented `version:` line (the
          # module pin); the apiVersion lines above have no leading space. The
          # pin always resets to v<ver>[-<prerelease>], so re-running with a
          # different PRERELEASE is idempotent.
          mr="$dir/moduleinstance.yaml"
          if [ -f "$mr" ]; then
            sed -i -E "s|^([[:space:]]+version:[[:space:]]+).*$|\1${tag}|" "$mr"
            echo "pinned ${name} moduleinstance -> ${tag}"
          fi
          # modulepackage fixture: the `"<path>": { v: "..." }` dep in cue.mod.
          # Not a path dependency, so `cue mod tidy` cannot move it; rewrite the
          # `v:` line that follows the dep's key.
          mp="{{.RELEASES_DIR}}/${name}/cue.mod/module.cue"
          if [ -f "$mp" ] && grep -q "\"${path}\"" "$mp"; then
            awk -v p="\"${path}\"" -v v="${tag}" 'index($0,p) {f=1} f && /v: "/ {sub(/"[^"]+"/, "\"" v "\""); f=0} {print}' "$mp" > "$mp.tmp" && mv "$mp.tmp" "$mp"
            echo "pinned ${name} modulepackage dep -> ${tag}"
          fi
          # config/samples ModuleInstance, when it instantiates this module.
          if [ -f "{{.SAMPLE_MI}}" ] && grep -q "path: ${path}$" "{{.SAMPLE_MI}}"; then
            awk -v p="path: ${path}" -v v="${tag}" 'index($0,p) {f=1} f && /version:/ {sub(/version: .*/, "version: " v); f=0} {print}' "{{.SAMPLE_MI}}" > "{{.SAMPLE_MI}}.tmp" && mv "{{.SAMPLE_MI}}.tmp" "{{.SAMPLE_MI}}"
            echo "pinned sample ModuleInstance (${name}) -> ${tag}"
          fi
        done

  bundle:
    desc: Bundle example ModuleInstance manifests into release assets under dist/
    cmds:
      - |
        set -euo pipefail
        rm -rf {{.DIST_DIR}}
        mkdir -p {{.DIST_DIR}}
        # Per-module ModuleInstance manifests.
        for dir in $(find {{.MODULES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort); do
          name=$(basename "$dir")
          if [ -f "$dir/moduleinstance.yaml" ]; then
            cp "$dir/moduleinstance.yaml" "{{.DIST_DIR}}/${name}-moduleinstance.yaml"
          fi
        done
        # ModulePackage/OCIRepository fixtures, where present.
        if [ -d "{{.RELEASES_DIR}}" ]; then
          for dir in $(find {{.RELEASES_DIR}} -mindepth 1 -maxdepth 1 -type d | sort); do
            name=$(basename "$dir")
            for f in "$dir"/modulepackage.yaml "$dir"/ocirepository.yaml; do
              [ -f "$f" ] && cp "$f" "{{.DIST_DIR}}/modulepackage-${name}-$(basename "$f")"
            done
          done
        fi
        tar -czf dist/opm-examples.tar.gz -C {{.DIST_DIR}} .
        echo "bundled manifests:"; ls -1 {{.DIST_DIR}}; echo "tarball: dist/opm-examples.tar.gz"
