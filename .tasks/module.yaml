version: '3'

# ModuleRelease end-to-end test tasks (CUE-native OCI resolution path).
#
# Prerequisites:
#   - Local registry running: `task registry:start`
#   - The fixture's deps published to the local registry: `test/fixtures/modules/hello`
#     pins `opmodel.dev/core@v2` and `opmodel.dev/catalogs/opm@v4` in its
#     `cue.mod/module.cue`, and the operator's generated platform module pins
#     exactly one build per subscribed catalog (the Platform CR's version), so
#     every pinned build must be present at the same coordinates:
#       * core:    from the `core/` repo —        `CUE_REGISTRY='opmodel.dev=localhost:5000+insecure' task publish VERSION=<pinned>`
#       * catalog: from the `catalog_opm/` repo —  `CUE_REGISTRY='opmodel.dev=localhost:5000+insecure' task publish VERSION=<pinned>`
#     (versions must match the fixture's pins and `config/samples/opmodel.dev_v1alpha1_platform.yaml`).
#     Requires a `cue` CLI at the kernel's CUE language version (v0.17.x) — the
#     catalog declares `language: v0.17.0` and older CLIs refuse to read it.
#   - Registry connected to kind network: `task registry:connect`
#   - Controller running (or deployed): `task build:run` / `task deploy:controller`
#
# The ModuleRelease path does NOT use Flux sources — the controller resolves
# the module directly from the OCI registry via CUE's module system.

vars:
  MODULE_DIR: '{{.MODULE_DIR | default "test/fixtures/modules/hello"}}'
  # Force the mapping used for publishing regardless of shell env. The fixture
  # lives under `testing.opmodel.dev/modules/operator/...` and its deps (core,
  # catalogs) under `opmodel.dev/...`; a shell-exported CUE_REGISTRY missing
  # either falls through to registry.cue.works and fails with 401. Deps resolve
  # from the local registry too, since this task exists for the fully-local flow.
  PUBLISH_REGISTRY: 'testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=localhost:5000+insecure,registry.cue.works'
  OPM: '{{.OPM | default "opm"}}'

tasks:
  publish:
    desc: Publish the hello module to the local registry via `opm module publish`
    cmds:
      # Explicit env prefix on each command — Task v3's `env:` block loses to
      # shell-exported CUE_REGISTRY, so force the mapping inline. OPM_REGISTRY is
      # what `opm` actually reads (--registry > OPM_REGISTRY > ~/.opm/config.cue);
      # CUE_REGISTRY is for `cue`. The version comes from the module's own
      # identity package — never passed in, so it cannot drift from the source.
      - cd {{.MODULE_DIR}} && CUE_REGISTRY='{{.PUBLISH_REGISTRY}}' cue mod tidy
      - cd {{.MODULE_DIR}} && CUE_REGISTRY='{{.PUBLISH_REGISTRY}}' OPM_REGISTRY='{{.PUBLISH_REGISTRY}}' {{.OPM}} module publish
      - echo "Published {{.MODULE_DIR}} at its declared version"

  publish:ghcr:
    desc: Publish the hello module to GHCR (requires `docker login ghcr.io` or ORAS-compatible creds)
    cmds:
      - cd {{.MODULE_DIR}} && CUE_REGISTRY='{{.GHCR_CUE_REGISTRY}}' cue mod tidy
      - cd {{.MODULE_DIR}} && CUE_REGISTRY='{{.GHCR_CUE_REGISTRY}}' OPM_REGISTRY='{{.GHCR_CUE_REGISTRY}}' {{.OPM}} module publish
      - echo "Published {{.MODULE_DIR}} to ghcr.io/open-platform-model"

  apply:
    desc: Apply the hello ModuleRelease manifest
    cmds:
      - '{{.KUBECTL}} apply -f {{.MODULE_DIR}}/moduleinstance.yaml'

  delete:
    desc: Remove the hello ModuleRelease CR
    cmds:
      - '{{.KUBECTL}} delete --ignore-not-found -f {{.MODULE_DIR}}/moduleinstance.yaml'
