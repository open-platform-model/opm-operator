apiVersion: opmodel.dev/v1alpha1
kind: Platform
metadata:
  labels:
    app.kubernetes.io/name: opm-operator
    app.kubernetes.io/managed-by: kustomize
  # Platform is a cluster singleton; the only permitted name is "cluster".
  name: cluster
spec:
  type: kubernetes
  registry:
    # Subscription keys carry the catalog's major (enhancement 0010 D14);
    # `version` names exactly one published build of that major — the
    # platform file IS the resolution, there is no range/allow/deny filter.
    opmodel.dev/catalogs/opm@v2:
      # Load-bearing pin: applied verbatim by the e2e specs, and kept aligned
      # with the CLI's DefaultPlatformTemplate seed and the library's
      # opm_platform fixture. Bump as an ordinary fixture update when the
      # catalog releases.
      version: "2.0.0-alpha.6"
    opmodel.dev/catalogs/k8s@v1:
      # Second subscription mirroring the CLI's seeded default (seed-both-
      # catalogs): the raw passthrough catalog, same commit as the opm@v2
      # bump above.
      version: "1.0.0-alpha.1"
