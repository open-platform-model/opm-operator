# Declares which enhancement decisions this change implements. Consumed by
# `task enhancements:delivery:log` at archive time.
implements:
  - enhancement: "0028"
    # D2: the module as the install shape's authority, rendered through the
    # catalog. This change delivers R1-R3 (generated CRDs and RBAC, drift
    # check), R8 (Pod Security restricted), R10 (names), R11 (one selector)
    # and R12 (catalog resources only). R9 and R13 (the install manifest as a
    # module-release asset, no operator-release manifest) belong to the
    # module's release change, which claims D2 again.
    # D5: the module side of the tuning surface: R1, R4, R5 and R6. R2 and R3
    # (reinstall keeps and checks recorded values) are the cli's.
    # D1 is not claimed: only R11 (the operator version readable from the
    # module) lands here; the release train (R4, R5, R9, R10, R13, R16) is the
    # release change's and R17-R19 are the cli's.
    decisions: [D2, D5]
    resolves: []
