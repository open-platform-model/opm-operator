# Declares which enhancement decisions this change implements. Consumed by
# `task enhancements:delivery:log` at archive time.
#
# 0021 D10 ("Release tags are immutable") is on enhancements PR 74, not yet on
# main, and is being revised for the release/vX.Y branch model. Log delivery
# only after D10 is on enhancements main; re-check the requirement numbers this
# change cites (R1, R3, R7) against that text first.
#
# This change covers the operator's share of D10: its release path never
# re-points a version registry tag, and its flow becomes draft-first so the
# repository can join immutable releases. The rulesets and the immutable
# release toggle are owner actions and are not claimed here.
implements:
  - enhancement: "0021"
    decisions: [D10]
    resolves: []
