# Declares which enhancement decisions this change implements. Consumed by
# `task enhancements:delivery:log` at archive time.
#
# decisions is deliberately empty. 0021 D10 ("Release tags are immutable",
# enhancements PR 74, not yet on main) spans five repos, the org rulesets and
# the Phase 2 release-branch automation; enhancements' schema.cue allows a
# number here only when the change delivers the decision whole, and D10 is
# claimed by whichever change completes it (Phase 2 at the earliest). The
# archive still logs this landing against 0021.
#
# Requirements this change carries for the operator's release path:
#   0021:D10:R1  no workflow moves, deletes or re-creates a tag
#   0021:D10:R3  :vX.Y.Z always resolves to the content first pushed under it
#   0021:D10:R8  draft-first flow, so the operator can join immutable releases
# Relied on, owner actions (gated in tasks.md): R6 (tag rulesets), R7
# (tags-create-app-only). Phase 2, not carried: R5 (release branches), R9
# (version-line rule). Re-check these numbers against D10 on enhancements
# main before archiving (task 4.2).
implements:
  - enhancement: "0021"
    decisions: []
    resolves: []
