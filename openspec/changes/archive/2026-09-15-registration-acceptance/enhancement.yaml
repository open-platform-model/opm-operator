# Declares which enhancement decisions this change implements. Consumed by
# `task enhancements:delivery:log` at archive time.
#
# Claimed conservatively. D10, D11 and D12 were over-claimed by earlier
# changes and removed from 0015's log; this change is the acceptance those
# decisions describe, so it completes them. D8 is wholly here.
