#         in registration-activation-and-lifecycle, which completes D3.
#   D2  - its acceptance arm refuses a claim for a contract an "active
#         subscription or registration already provides". This change
#         establishes no activeness, so the activation change completes it.
#   D16 - the finalizer and the shrink refusal, in the activation change.
#
# Before logging, diff this list against proposal.md's "Not in this change"
# section and drop anything it names.
implements:
  - enhancement: "0015"
    # D11 dropped at archive, by the check this file's header names. Its
    # decision statement has a catalog half: "The provider catalog exports a
