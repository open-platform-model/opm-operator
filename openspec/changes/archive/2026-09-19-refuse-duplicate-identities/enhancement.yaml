# Declares which enhancement decisions this change implements. Consumed by
# `task enhancements:delivery:log` at archive time.
implements:
  - enhancement: "0015"
    # D15: one registration per module, a second refused loudly naming both
    # carrying components, before apply. The library ships the detector
