schema: spec-driven

references:
  - id: opm-enhancements
    remote: https://github.com/open-platform-model/enhancements.git

context: |
  # OPM Controller Development Constitution
  
  ## Core Principles (Kubernetes Controller)
  
  ### I. CUE-Native Module Resolution
  For CUE module acquisition, the controller MUST use CUE's native module system to resolve modules from OCI registries. The controller synthesizes a `#ModuleRelease` CUE package at reconcile time. CUE handles OCI resolution, dependency resolution, and caching. The `internal/source/` package is retained for BundleRelease and potential future use.

  ### II. Separation of Concerns
  The controller MUST maintain clear internal boundaries:
  - `internal/controller/`: Reconcile orchestration and event handling.
  - `internal/moduleacquire/`: Module acquisition from the OCI registry, through the library Kernel.
  - `internal/source/`: Flux artifact interaction (retained for BundleRelease).
  - `internal/render/`: CUE evaluation and object generation (via shared CLI packages).
  - `internal/apply/`: Server-side apply and prune execution.
  - `internal/inventory/`: Resource ownership calculations.

  ### III. Authoritative Inventory
  Resource ownership MUST be tracked explicitly via `status.inventory`.
  - Pruning decisions rely on inventory, not labels.
  - Labels (`app.kubernetes.io/managed-by`) are supportive hints for humans.
  - Apply must succeed before prune executes.

  ### IV. Status as the Operational Ledger
  The CRD `status` is the single source of truth for reconcile history.
  - Reconcile outcomes, source digests, config digests, and render digests live in `status`.
  - History is bounded and compact.

  ### V. Declarative Intent via SSA
  Mutations MUST use Server-Side Apply (SSA).
  - The controller declares desired state; the API server resolves conflicts.
  - Transient API errors should requeue; permanent errors (invalid config) should stall.

  ### VI. Semantic Versioning & Commits
  Controller releases MUST follow SemVer 2.0.0.
  All commits MUST follow Conventional Commits v1: type(scope): description
  - Types: feat, fix, refactor, docs, test, chore
  - Scope: api, controller, source, render, apply, inventory, etc.
  - Beta line: From its first beta, a prerelease line (`opmodel.dev/core@v2`,
    library, cli, opm-operator) is on the path to GA. A breaking
    change is still allowed during beta, but only as a `!` in the PR title (`feat!:`), the only
    text the squash commit carries (`squash_merge_commit_message: BLANK`); the title is the
    CHANGELOG entry, and the migration note goes in the PR body, which that entry links. It
    advances the `-beta.N` counter and never moves the module path to a new major. Stable lines
    (`opmodel.dev/catalogs/opm@v4` and the module fleets) keep the normal SemVer rule:
    a break is a new major. A core beta break that would force a catalogs/opm major needs owner
    sign-off. GA drops the suffix: `prerelease: false` plus a visible carrier commit per package,
    in dependency order.

  ### VII. Simplicity & YAGNI
  Start simple. Complexity MUST be justified.
  - e.g., Defer complex rollback logic or cross-release dependency graphs (`dependsOn`) until v1alpha1 basic execution is proven.

  ### VIII. Mergeable Sections (Iterative & Incremental Delivery)
  A change is delivered as the sections of its `tasks.md` (`## N. Title` headings with `N.M`
  checkboxes). Two invariants hold at every section boundary; they replace any size limit on
  the change itself.
  - **Every merge leaves `main` releasable.** A section MUST end green under the validation
    gates and MUST close with a commit task naming the Conventional Commit it lands as
    (Principle VI). Nothing that would break `main` is carried across a section boundary.
  - **Work survives a session boundary.** The commit task is the pause point: a session that
    stops there leaves checked boxes and a clean tree, and the next session resumes by running
    apply again.
  - One PR per change, one commit per section, is the default. Section 1 is a spike whenever
    design.md carries an unverified assumption.
  - **WARNING & BLOCK**: when a request cannot be cut into sections that each satisfy both
    invariants, or needs more than about five, the Agent MUST warn, block, and propose a split
    into sequential changes (Execution Gate).

  ## Execution Gate (Agent Directive)
  Before beginning ANY implementation, the Agent MUST evaluate the request against the
  "Mergeable Sections" principle. Block only when the request cannot be cut into sections that
  each end green and leave `main` releasable, or when it needs more than about five such
  sections. In that case the Agent MUST reply with:
  "🛑 **Scope Warning**: This request does not cut into a handful of mergeable sections. I
  suggest we split it into the following changes: [list 2-3 changes, each a few sections that
  leave main releasable]. Should we start with the first?"

  ## Technology Standards
  
  See [AGENTS.md](../AGENTS.md) for full details.
  - Framework: `controller-runtime` + `kubebuilder`
  - GitOps Toolkit: `github.com/fluxcd/pkg` for conditions, patching, ssa, fetch.

  ## Code Style
  
  ### Go Patterns
  - Accept interfaces, return structs.
  - Context propagation for all async operations.
  - Wrap errors with context: `fmt.Errorf("fetching artifact: %w", err)`.
  - Prefer concrete types over `map[string]any`.
  - Do not hand-edit generated files (`zz_generated.deepcopy.go`, `config/crd/bases/`).
  
  ### Logging
  - Use structured logging via controller-runtime `logf`.
  - Capitalize messages, no trailing periods.

  ### Import Order
  1. Standard library
  2. External packages (including Flux)
  3. Internal packages
  
  ### Comments
  - Default to no enhancement reference: say what the code does and why, in the comment's own words.
  - In any text (proposal, design, specs, comments), name an enhancement only by its id beside a reason in words, never alone, never a decision number.
  - When the rationale genuinely lives in an enhancement, name it once at the symbol, as an enhancement id beside the reason in words: `(enhancement NNNN)` after the sentence that gives the reason, or `(enhancements NNNN and MMMM)` for two. Never an id alone, never a decision number (for example `NNNN:Dn` or `NNNN Dn`): say the decision in words.
  - Never cite a section, slice, phase, task or design-doc-local id (`§8.1`, `slice C2`, `task 4.2`, `design LD3`). They are not stable identifiers.
  - Never put a reference in a scaffold template, a generated file, a fixture a user copies, or a CLI output string. Those reach people with no access to the enhancements repo.
  - No `Was:` rename history in comments; `git log` owns it.
  - In CUE, the reference goes in a `// WHY` block separated from the doc comment by one blank line, never in the doc comment itself: `cue lsp` hover, `Value.Doc()` and `cue def` replay a doc comment verbatim.
  - To read an enhancement, run `openspec show <id>-<slug> --store opm-enhancements` (the store is the `references:` entry above). If OpenSpec warns that the store `opm-enhancements` is not registered, report the warning and go on; the human runs `task enhancements:register`.

  ## Validation Gates (before merge)
  1. `task dev:manifests dev:generate` — CRDs and DeepCopy code are up-to-date.
  2. `task dev:fmt dev:vet` — Code is formatted and passes go vet.
  3. `task dev:lint` — golangci-lint passes.
  4. `task dev:test` — Envtest-based unit/controller tests pass.
  5. `task docs:bundle:check` — the docs-kit pins agree and the opm-operator docs bundle builds and lints.

rules:
  proposal:
    - "Focus: WHY we're doing this, WHAT's in/out of scope"
    - "Updates when: Scope changes, intent clarifies, approach fundamentally shifts"
    - Identify affected API types and controllers.
    - State whether this is MAJOR/MINOR/PATCH per SemVer; until GA, state the class as it would be
      after GA and note that beta ships it as the next `-beta.N`.
    - Complexity additions MUST include justification (Principle VII).
    - Scope MUST cut into at most about five tasks.md sections, each ending green and leaving
      `main` releasable on its own (Principle VIII).
    - "Delivery mode: one PR per change is the default and needs no statement. When a downstream
      consumer must pick up a published pin mid-change, add exactly one line to the proposal,
      `Delivery: one PR per section (<consumer> needs <pin> after section <N>)`, and the change
      ships section by section. In that mode the change stays active on main between PRs, and
      spec sync waits for archive after the last PR."
    - "If the change delivers a line of an enhancement's `tasks.md`, add `## Enhancement` with one line `Delivers NNNN, task X.Y.` per task; otherwise `None.`"
    - "Name an enhancement only by its id beside a reason in words, never alone, never a decision number."
  
  design:
    - "Focus: HOW we'll implement it technically"
    - "Updates when: Implementation reveals better approach, constraints change"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - MUST include "Research & Decisions" section when exploration was done.
    - |
        ## Research & Decisions
        
        ### [Topic]
        **Context**: [Why this decision was needed]
        **Explored**: [What was investigated - link to exploration notes]
        **Decision**: [Chosen option]
        **Rationale**: [Why this option was selected]
    - Include Go pseudo-code or Kubernetes manifest examples.
    - Detail Reconcile phase impact (Source, Render, Apply, Prune, Status).
    - "Name an enhancement only by its id beside a reason in words, never alone, never a decision number."
  
  specs:
    - "Focus: WHAT behavior is changing (not HOW it's implemented)"
    - "Updates when: New or changed requirements emerge"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - When a requirement implements an enhancement, name the enhancement as an id beside the
      reason in words in its body (first sentence or a trailing `Source:` line), never alone and
      never as a decision number, and never inside the `### Requirement:` header, which tools
      read as the requirement's name.
    - Describe observable behavior (CRD status changes, created resources, logs).
    - Use ADDED/MODIFIED/REMOVED sections to show deltas.
    - Include scenarios demonstrating controller behavior (e.g., Transient Error vs Stalled).
  
  tasks:
    - "Focus: STEPS to take for implementation"
    - "Updates when: Tasks complete, new tasks discovered, blockers identified"
    - "CRITICAL: Every `## N.` section MUST end green under the validation gates and MUST close
      with a commit task: an ordinary `- [ ] N.M` checkbox whose text names the Conventional
      Commit to make, e.g. `- [ ] 1.4 task dev:fmt dev:vet dev:lint dev:test green, then commit feat(controller): add the source grant phase`
      (types and scopes per Principle VI). The commit task is the pause point; nothing uncommitted is carried across
      a section boundary."
    - "CRITICAL: Cut the change into at most about seven sections, each a coherent unit that
      leaves main releasable by itself. If it needs more, or a section cannot end green on its
      own, split into a new OpenSpec change. Section 1 is a spike whenever design.md carries an
      unverified assumption; its commit task lands what the spike produced (a test, a fixture,
      or the finding written into design.md)."
    - Group tasks by component (API, Internal Packages, Controller).
    - Ensure `task dev:manifests dev:generate` is run after API changes.
    - Include the validation gates (`task dev:fmt dev:vet dev:lint dev:test`, after `task dev:manifests dev:generate` when API types changed) in every section's commit task, not as a
      trailing section; cross-cutting checks (e2e runs, consumer builds) go into the last real section before
      its commit.
    - "The section-closing commit is the ONLY delivery operation allowed in tasks.md: no pushing,
      branching, opening or merging PRs, tagging, cutting releases, and no commit-message or
      PR-body hygiene checks. Everything past the commit happens under the repo's normal git
      workflow (one PR per change by default; one PR per section only when the proposal says
      so). Sole exception: a change whose stated deliverable is itself a release or publishing
      operation; there those steps ARE the implementation."

# Operation hooks: served to the agent by `openspec instructions apply|archive --change <name>
# --json` as operationGuidance.
operations:
  apply:
    guidance:
      - "Work section by section: every `## N.` block of tasks.md ends with a commit task. Before
        checking that box, run the section's gates (`task dev:fmt dev:vet dev:lint dev:test`, after `task dev:manifests dev:generate` when API types changed) on the whole tree and make
        exactly the named Conventional Commit (types and scopes per Principle VI; optional plain Co-Authored-By: Claude
        <noreply@anthropic.com> trailer only, never a session link, never a bare @name, and
        no body line starting with word( because release-please drops a commit with such a body line, footer included, whenever the body reaches `main` (any merge not made under the `BLANK` squash message)). Do not start the next section with uncommitted work in the tree."
      - "The commit task is the only delivery operation apply performs: no push, no PR, no tag,
        no release. Commit on the working branch the run started on. If the run started on
        main, create the working branch before the first commit task; never commit to main."
      - "Pausing: when the user asks to pause, or a blocker appears, finish the current section's
        commit task first if its gates are green; otherwise report exactly which boxes are
        checked and what is uncommitted in the tree. A new session resumes by running apply
        again: the checked boxes plus a clean tree are the resume state."
      - "Delivery mode: unless proposal.md carries `Delivery: one PR per section`, all section
        commits ship in one PR after the last section and the PR title carries the change's
        release class: the highest class among its section commits (`!` over `feat` over a
        releasing patch type (`fix`, `deps`, `perf`, `refactor`, `revert`) over a hidden type),
        because under the `BLANK` squash message only the title reaches `main`. In per-section
        mode each section commit is the PR title and therefore a release trigger; the change
        stays active on main between PRs, and spec sync waits
        for archive after the last PR."
  archive:
    guidance:
      - "If the change delivers a line of an enhancement's `tasks.md`, name it in the PR body; after the repo PR merges, a PR on `enhancements` ticks that line."
